# =============================================================================
# A股长期投资趋势判断与个股打分系统 —— 主配置
# 所有权重、阈值都在这里，改这个文件即可调参，不用动代码。
# =============================================================================

[general]
# 回测/打分起始日期
start_date = "2011-01-01"
# 打分基准日，留空则取最新交易日
as_of = ""
# 本地缓存目录（首次抓取后离线可用）
cache_dir = "data_cache"
output_dir = "output"
# 本机代理（留空表示直连）。这台机器实测需要走代理才能访问外网。
proxy = "http://127.0.0.1:7897"
# 缓存过期天数：宏观月度数据 7 天，行情 1 天
cache_ttl_macro_days = 7
cache_ttl_price_days = 1
# 复权方式：qfq(前复权) / hfq(后复权) / ""
adjust = "qfq"


# =============================================================================
# 实时模式（--live 或把 enabled 改成 true 即生效）
# -----------------------------------------------------------------------------
# 打开后，各类数据的缓存 TTL 从「天」压到「分钟」，每次重跑都会重新抓最新值。
# 注意：并非所有数据都能实时——宏观（PMI/CPI/PPI/GDP）本身按月/季公布，财务按季，
# 分红按事件。能实时的只有行情快照（价格 / PE / PB / 市值）与美股汇率商品。
# =============================================================================
[realtime]
enabled = false
# 行情快照（价格 / PE-TTM / PB / 市值）刷新间隔，分钟
quote_ttl_minutes = 3
# 个股估值历史（百度）与指数日线刷新间隔，分钟
history_ttl_minutes = 30
# 美股 / 美元指数 / 美债利率刷新间隔，分钟
us_ttl_minutes = 30
# 中国宏观（PMI/CPI/PPI/GDP/M2/国债）刷新间隔，小时
macro_ttl_hours = 6
# 个股财务、分红、行业归属刷新间隔，小时
fund_ttl_hours = 24
# 看板 HTML 自动刷新间隔（秒），0 = 不自动刷新
#   大于 0 时会往 dashboard.html 里写 <meta http-equiv="refresh">，
#   浏览器每隔 N 秒重新载入页面（需要配合 --watch 才能真正更新数据）
dashboard_refresh_seconds = 300   # 看板自动重载秒数；配合 run_all.py --live --watch 使用（0=关闭）


# =============================================================================
# 一、宏观背景分（决定总仓位，不决定买哪只票）
# 五大模块各自算出 0~100 分，再按权重合成「宏观背景分」。
# 宏观背景分 → 目标股票仓位系数（见 [position]）。
# =============================================================================
[macro_weights]
# 用户原始诉求里 PMI 是最重要的择时信号，给最高权重
pmi = 0.30
# PPI 库存周期：判断股市在周期中的位置
ppi = 0.25
# 美联储潮汐：全球流动性的水龙头
fed = 0.20
# CPI：通胀与股债性价比
cpi = 0.15
# GDP：低频、滞后，只作背景确认
gdp = 0.10


# --- 1) PMI 模块 -------------------------------------------------------------
# 用户规则：“GDP、PMI 与股市正相关。该值大幅度超过 50 或处于上升阶段，
#           股市大概率可能上涨。”
[pmi]
# 荣枯线
expansion_level = 50.0
# “大幅度超过 50” 的判定阈值
strong_level = 51.5
# 处于上升阶段：连续 N 个月环比上行算确立
uptrend_months = 2
# 只统计制造业 PMI，还是制造业+非制造业合成
include_non_manufacturing = true
# 非制造业在合成里的权重（若 include_non_manufacturing = true）
non_manufacturing_weight = 0.35
# 水平项与动量项在 PMI 模块内的占比
level_weight = 0.45
momentum_weight = 0.55
# 动量回溯月数（算 PMI 的 3 个月移动平均斜率）
momentum_lookback = 3


# --- 2) CPI 模块 -------------------------------------------------------------
# 用户规则：“CPI 涨得快利好股市和债市，涨得慢不利于股市和债市。”
# 落地为两个子项：
#   (a) 速度项：CPI 同比的上行速度（快 = 利好）—— 用户规则的主逻辑
#   (b) 水平项：温和通胀最优，通缩与滞胀都扣分 —— 风险约束
[cpi]
# 速度项权重（按用户原话，速度是主逻辑）
speed_weight = 0.65
# 水平项权重
level_weight = 0.35
# CPI 同比 3 个月变化达到多少个百分点算“涨得快”
fast_rise_3m = 0.3
# 温和通胀区间（同比 %），落在区间内水平项满分
sweet_spot_low = 0.5
sweet_spot_high = 3.0
# 通缩警戒线：低于此值水平项重扣（不利股债）
deflation_line = 0.0
# 滞胀警戒线：高于此值且仍在加速，水平项转负
overheat_line = 3.5
# 滞胀时是否启用一票否决（把 CPI 模块总分压到 30 分以下）
stagflation_override = true


# --- 3) PPI 模块 -------------------------------------------------------------
# 用户规则：“PPI 下跌到一半，股市会领先上涨；当 PPI 到底部时，
#           股市已经就到顶峰了。”
# 实现方式：度量 PPI 同比相对「本轮周期高点」的回撤比例 r。
#   r = (周期高点 - 当前PPI同比) / (周期高点 - 周期低点)
# 然后按 r 给分（钟形：回撤到一半最看多，见底反而看空）。
[ppi]
# 回撤到多少算“下跌到一半”——最优买点区间
half_retrace = 0.50
# 买点区间宽度（0.50 ± half_band）
half_band = 0.12
# 回撤超过多少算“到底部”——见顶警告
bottom_retrace = 0.85
# 周期高点/低点的识别回溯窗口（月）
cycle_lookback_months = 60
# 用 PPI 同比还是 PPI 环比累计（同比更稳）
use_yoy = true
# 对“PPI 到底部 = 股市见顶”的解读：
#   "peak_warning"     —— 用户原话，底部 → 见顶警告，减仓（默认）
#   "late_stage_bull"  —— 底部 → 牛市后段，仍可持有但不再加仓
bottom_interpretation = "peak_warning"
# PPI 法定公布滞后（月），用于对齐到「当时可知」的时点，避免未来函数
publish_lag_months = 1


# --- 4) GDP 模块 -------------------------------------------------------------
[gdp]
# 用同比增速
use_yoy = true
# 与过去 N 个季度的均值比较，判断加速/减速
lookback_quarters = 8
# 水平项权重（增速绝对水平）
level_weight = 0.4
# 动能项权重（增速变化方向）
momentum_weight = 0.6
# 增速连续回升多少个百分点算确立
rise_threshold = 0.2
# GDP 季度数据公布滞后（月）
publish_lag_months = 1


# --- 5) 美联储潮汐模块 -------------------------------------------------------
# “潮汐”= 全球美元流动性。
#   涨潮：降息 / 扩表 / 利率下行 / 美元走弱 → 利好新兴市场与A股
#   退潮：加息 / 缩表 / 利率上行 / 美元走强 → 利空
#
# 数据源（本机网络实测）：
#   主源 = Yahoo Finance chart 接口；^IRX 短端 / ^TNX 10年 / DX-Y.NYB 美元指数
#   FRED 的 fredgraph.csv 已不可达（SSL EOF + ReadTimeout），仅用于尝试抓 WALCL
#   akshare 金十系美国宏观接口只更新到 2025-10，末行还是 NaN，已弃用
[fed]
# 五个子项权重（缺席的子项会在其余子项间重新归一化，不按 0 分算）
weight_policy_rate = 0.30   # 短端利率方向（^IRX，13周美债＝政策利率的市场代理）
weight_long_rate = 0.22     # 长端利率（^TNX，10年期美债名义收益率）
weight_dollar = 0.20        # 美元指数 DXY
weight_rate_spread = 0.16   # 中美10年期利差（影响外资流入）
weight_balance_sheet = 0.12 # 美联储资产负债表(WALCL)同比；该源常缺席
# 短端利率 6 个月变化达到多少 bp 算明确转向（降这么多=满分，升这么多=0分）
rate_change_bp = 100.0
# 短端利率绝对水平：0.5% 及以下算宽松满分，5.0% 及以上算限制性零分
rate_level_bad = 5.0
rate_level_good = 0.5
# 10年期美债名义收益率：1.5% 及以下满分，5.5% 及以上零分
long_rate_bad = 5.5
long_rate_good = 1.5
# 美元指数 6 个月涨跌多少百分比算明确走强/走弱
dollar_change_pct = 6.0
# 中美利差（中债−美债，bp）的帐篷形评分：倒挂越深越差，适度为正最好，过宽也差
spread_low_bp = -400.0
spread_sweet_bp = 200.0
spread_high_bp = 900.0
# 资产负债表同比收缩多少算缩表
bs_shrink_pct = -2.0
# 各子项回溯月数
lookback_months = 6


# =============================================================================
# 二、宏观背景分 → 目标仓位系数
# 这是「择时」的落点：宏观越好，允许的股票仓位越高。
# =============================================================================
[position]
# 分段线性映射：宏观背景分 → 股票目标仓位
# 格式 [分数下限, 仓位]
[[position.ladder]]
score = 0
position = 0.10
[[position.ladder]]
score = 30
position = 0.30
[[position.ladder]]
score = 45
position = 0.50
[[position.ladder]]
score = 60
position = 0.70
[[position.ladder]]
score = 75
position = 0.90
[[position.ladder]]
score = 100
position = 1.00


# =============================================================================
# 三、个股打分
# 长期投资视角：估值(PE/PB/股息率) + 质量 + 政策红利。
# =============================================================================
[stock_weights]
valuation = 0.45   # 估值：PE 分位 + PB 分位 + 股息率分位
quality   = 0.30   # 质量：ROE、现金流、负债、盈利稳定性
dividend  = 0.15   # 股息：绝对水平 + 连续分红年数 + 是否跑赢国债
policy    = 0.10   # 政策红利：所属行业/个股是否在政策扶持目录

[valuation]
# PE / PB / 股息率 在估值项内部的权重
pe_weight = 0.40
pb_weight = 0.30
dividend_yield_weight = 0.30
# 历史分位回溯年数
percentile_years = 5
# 分位样本不足时的最少有效月数，不足则退化为绝对值打分
min_percentile_months = 24
# 分位数越低越好（估值便宜）→ 分数 = 100 * (1 - 分位)
# 行业中性化：扣除所属行业中位数后再算分位，避免银行/科技不可比
industry_neutral = true
# 格雷厄姆数门槛：PE × PB 应小于该值
graham_number = 22.5
# 不同行业使用不同主指标
#   银行/保险/地产 → PB 为主
#   公用事业/交运/煤炭 → 股息率为主
#   其余 → PE 为主
[valuation.industry_primary]
# TOML 的裸键只允许 ASCII 字母/数字/下划线/短横，中文键必须加引号，
# 否则 tomllib 直接报 "Invalid statement"。
"银行" = "pb"
"保险" = "pb"
"房地产" = "pb"
"证券" = "pb"
"公用事业" = "dividend_yield"
"交通运输" = "dividend_yield"
"煤炭" = "dividend_yield"
"钢铁" = "pb"
"有色金属" = "pb"
"石油石化" = "dividend_yield"
"食品饮料" = "pe"
"医药生物" = "pe"
"电子" = "pe"
"计算机" = "pe"
"传媒" = "pe"
"电力设备" = "pe"
# 主指标在估值项内的额外加成
primary_bonus = 0.15

[dividend]
# 股息率绝对值门槛（%）：达到给满分
excellent_yield = 5.0
# 及格线（%）
pass_yield = 2.0
# 与 10 年期国债收益率比较：高出多少个百分点算有吸引力
spread_over_bond = 1.0
# 连续分红年数：满几年给满分
full_credit_years = 10
# 连续分红年数权重 vs 股息率水平权重（内部归一化）
years_weight = 0.35
level_weight = 0.45
spread_weight = 0.20

[quality]
# 各指标权重（内部归一化）
weight_roe = 0.30
weight_cashflow = 0.25    # 经营现金流 / 净利润
weight_debt = 0.20        # 资产负债率（越低越好，金融业豁免）
weight_stability = 0.25   # 净利润增速波动率（越低越好）
# ROE 门槛（%）
roe_excellent = 20.0
roe_pass = 8.0
# 经营现金流/净利润 门槛
cashflow_excellent = 1.0
cashflow_pass = 0.6
# 资产负债率门槛（%）
debt_excellent = 40.0
debt_pass = 70.0
# 金融行业豁免资产负债率
debt_exempt_industries = ["银行", "保险", "证券", "房地产"]
# 稳定性：近 N 年净利润增速标准差
stability_years = 5
stability_excellent = 0.10
stability_pass = 0.40

[policy]
# 政策红利分：个股所在行业在政策目录中的得分 + 个股自身事件（如央企改革、回购增持）
# 行业政策强度上限
industry_max = 80.0
# 个股政策事件上限
event_max = 20.0
# 政策事件半衰期（天）：政策效力随时间衰减
event_half_life_days = 180
# 政策文件路径
industry_policy_file = "config/industry_policy.csv"
event_file = "config/policy_events.csv"


# =============================================================================
# 四、筛选与回测
# =============================================================================
[screen]
# 剔除 ST / *ST
exclude_st = true
# 剔除上市不足 N 个交易日的次新股（长期投资不宜）
min_listed_days = 365
# 剔除日均成交额过低（万元）
min_avg_amount_wan = 2000
# 剔除资产负债率过高的非金融股（%），超过直接剔除
max_debt_ratio = 85.0
# 剔除 PE<=0（亏损）的股票（长期价值投资口径）
exclude_negative_pe = true
# 回测调仓频率：M(月) / Q(季) / A(年)
rebalance = "Q"
# 每期持有股票数
top_n = 30
# 最少上市年份
min_listed_years = 3

# =============================================================================
# 四之二、个股买卖规则（最直接可用的一节）
#
# 和上面的「加权总分」不同：总分是排序用的，买卖规则是**逐条硬门槛**。
# 买入是 AND：buy_* 每一条都满足才建议建仓，任何一条不满足都会写清是哪一条。
# 卖出是 OR：sell_* 任意一条触发就给出减仓/清仓建议，并写明触发的是哪一条。
# 所有阈值都可以改，改完直接重跑，报告里的每条建议都会跟着变。
# =============================================================================
[plan]
# ---- 买入门槛（全部满足才建议建仓）----
# 总分下限（72 = A 级）
buy_min_total = 72.0
# 质量分下限（60）：便宜但烂的公司不买
buy_min_quality = 60.0
# PE 历史分位上限（0.40 = 比自身近 5 年 60% 的时间都便宜）
buy_max_pe_percentile = 0.40
# PB 历史分位上限
buy_max_pb_percentile = 0.40
# 股息率下限（%）：长期投资要真实现金回报，光便宜不分红不算
buy_min_dividend_yield = 2.0
# PE 绝对值上限：防止分位失真——有些股票常年高估，「回到自身中位」仍然很贵
buy_max_pe_abs = 40.0
# 格雷厄姆数 PE × PB 上限。
# 注意：格雷厄姆原文的 22.5（PE≤15 且 PB≤1.5）是给 1930 年代美股定的深价值线，
# 直接套 A 股会把绝大多数公司挡在门外——实测本系统候选池里 PE×PB 的中位数约 62
# （茅台 19.3×6.3=120、长江电力 63.9、宁德时代 55.6，而工行 5.9、招行 6.4）。
# 所以这里的默认值是 50（A 股中枢以下），并把经典 22.5 留在 [valuation] graham_number
# 里作为「估值优秀」的标记参与估值打分。想用原教旨标准就把它改回 22.5。
buy_max_graham = 50.0
# 宏观背景分下限：低于此值不建议建新仓（大盘环境太差时个股再好也先等）
buy_min_macro_score = 45.0
# 排在「本次已打分的候选池」前百分之几以内（0.20 = 前 20%）。
# 默认 0 = 不启用：这个分位是相对候选池算的，池子大小一变（24 只 vs 300 只）
# 门槛的绝对含义就变了，当成硬门槛会让结果随运行参数漂移，不适合做一票否决。
buy_max_rank_pct = 0.0
# 容差：买入门槛差几条以内仍算「接近建仓」并列进跟踪表（0 = 必须全通过）
# 目的是让跟踪表有可操作的分层，而不是只有「建仓」和「回避」两档。
buy_near_miss = 1

# ---- 卖出门槛（任意一条触发即给建议）----
# 1) 估值止盈：PE / PB 回到自身历史高位
sell_pe_percentile = 0.80
sell_pb_percentile = 0.80
# 2) 绝对估值过高：PE×PB 或 PE 本身到了泡沫区。
# 阈值必须明显高于 buy_max_graham，否则会自相矛盾（刚满足买入就被判泡沫）。
sell_graham = 120.0
sell_pe_abs = 60.0
# 3) 股息率塌陷（%）——分红能力下降，或股价涨到现金回报不再有吸引力
sell_dividend_yield = 1.0
# 4) 总分掉档（62 = B 级）：当初的买入理由已经不成立
sell_total = 62.0
# 5) 压力位减仓：总分掉到该值以下但未破 sell_total，先减半仓
sell_reduce_total = 67.0
# 6) 宏观转防御：背景分低于此值，整体降仓
sell_macro_score = 30.0
sell_macro_reduce_score = 40.0
# 7) 风控：相对买入价的止损 / 止盈（小数，-0.25 = 亏 25% 止损）
sell_stop_loss = -0.25
sell_take_profit = 1.50
# 8) 基本面恶化：经营现金流/净利润 低于该倍数即预警
sell_cashflow_floor = 0.50
# 净利润增速连续为负的年报数达到该值即预警
sell_negative_growth_years = 2

# ---- 跟踪表 ----
# 持仓台账（自己维护：代码,名称,买入日期,买入价,股数,备注）。文件不存在则只输出买入候选
holdings_file = "config/holdings.csv"
# 跟踪结果落盘位置
tracking_file = "output/tracking.csv"
# 跟踪清单里最多列多少只（不含已持仓）
tracking_top = 40
# 「减仓」时建议卖出持仓的多少比例（0.5 = 卖一半）。回测与跟踪表共用这一个值。
reduce_ratio = 0.5
# 持仓视图落盘位置（个人持仓盈亏 + 卖出提醒）
portfolio_file = "output/portfolio.csv"

[fees]
# A 股真实费率。改这里，持仓表的「扣费后净盈利」立刻跟着变。
# 佣金：双向收取，券商可调（常见万 2.5 ~ 万 3），单笔最低 5 元
commission_rate = 0.00025
commission_min = 5.0
# 印花税：仅卖出收取，2023-08-28 起由 0.1% 减半为 0.05%
stamp_duty_rate = 0.0005
# 过户费：双向收取，沪深两市均收
transfer_fee_rate = 0.00001
note = "佣金双向含最低5元；印花税仅卖出；过户费双向。请按你的券商实际费率核对。"

[backtest]
# 基准指数
benchmark = "000300"          # 沪深300
# 组合加权方式：equal(等权) / dividend(股息率加权) / score(得分加权)
weighting = "equal"
# 交易成本（单边，含印花税与佣金）
cost_rate = 0.0015
# 无风险利率（年化，用于夏普）
risk_free_rate = 0.025
# 验证宏观规则时，前瞻收益的观察窗口（月）
forward_months = [3, 6, 12]
# 回测起始（受 general.start_date 约束）
min_stocks_per_period = 10
# 回测C（个股逐笔买卖）：回看多少个月。它会逐月对每只候选股重打分，
# 是最慢的一步；想快就在命令行加 --skip-stocks-backtest
stocks_months = 48


# =============================================================================
# 五、报告
# =============================================================================
[report]
# 生成的看板文件名
dashboard_file = "dashboard.html"
# Markdown 报告
report_file = "report.md"
# Excel 明细
excel_file = "score_detail.xlsx"
# 看板中展示的个股数
top_display = 50
# 是否在报告中输出「规则有效性验证」章节
include_rule_validation = true
