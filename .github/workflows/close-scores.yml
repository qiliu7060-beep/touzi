name: Daily full-market close scores
run-name: "Close scores · ${{ github.event_name }} · ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[run-close]') && 'checks only' || 'publish' }}"

on:
  workflow_dispatch:
  schedule:
    # 北京时间17:23首轮、18:23重试，次日05:23补偿（UTC同一周一至五）。
    - cron: '23 9 * * 1-5'
    - cron: '23 10 * * 1-5'
    - cron: '23 21 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-scores.yml'
      - 'scripts/close_batch.py'
      - 'scripts/publish_close.py'
      - 'scripts/check_close_snapshot.mjs'
      - 'scripts/close-score-validation.mts'
      - 'scripts/market-calendar.mjs'
      - 'config/settings.toml'
      - 'config/trading-calendar.json'
      - 'touzi/plans.py'
      - 'touzi/screener.py'
      - 'touzi/data/**'
      - 'touzi/close_snapshot.py'
      - 'tests/test_close*.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-close-scores
  # 较慢首轮不会被18:23重试取消；后者排队后检查同日成功幂等。
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  TOUZI_PROXY: ''

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest tests.test_close_snapshot tests.test_close_batch tests.test_close_schedule tests.test_buy_decision tests.test_sell_snapshot

  prepare:
    needs: check
    # 只有显式授权的启动提交可在push时精算；普通push仍只检查。
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-close]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      run: ${{ steps.freeze.outputs.run }}
      matrix: ${{ steps.freeze.outputs.matrix }}
      status: ${{ steps.freeze.outputs.status }}
      score_date: ${{ steps.freeze.outputs.score_date }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data_cache
          key: touzi-close-prepare-${{ github.run_id }}
          restore-keys: touzi-close-prepare-
      - name: Anchor target to original workflow creation (stable across retries)
        id: anchor
        if: github.event_name == 'schedule'
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId
            });
            core.setOutput('created_at', data.created_at);
      - name: Freeze actual complete close and full eligible market
        id: freeze
        env:
          CLOSE_CREATED_AT: ${{ steps.anchor.outputs.created_at }}
          CLOSE_SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/close_batch.py prepare --created-at "$CLOSE_CREATED_AT" --schedule "$CLOSE_SCHEDULE" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.freeze.outputs.run == 'true'
        with:
          name: close-input
          path: .close-input/
          include-hidden-files: true
          retention-days: 3

  score:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: close-input
          path: .close-input/
      - uses: actions/cache@v4
        with:
          path: data_cache
          key: touzi-close-batch-${{ matrix.batch }}-${{ github.run_id }}
          restore-keys: touzi-close-batch-${{ matrix.batch }}-
      - name: Score batch with bounded per-stock subprocess budget
        run: python scripts/close_batch.py score --batch ${{ matrix.batch }} --output .close-results/batch-${{ matrix.batch }} --workers 6 --stock-timeout 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: close-result-${{ matrix.batch }}
          path: .close-results/batch-${{ matrix.batch }}/batch.json
          include-hidden-files: true
          retention-days: 3

  publish:
    needs: [prepare, score]
    if: needs.prepare.outputs.run == 'true' && needs.score.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: close-input
          path: .close-input/
      - uses: actions/download-artifact@v4
        with:
          pattern: close-result-*
          path: .close-results/
      - name: Validate all completed batches, score coverage and immutable shards
        run: |
          python scripts/close_batch.py assemble
          python scripts/publish_close.py --validate-only
          node scripts/check_close_snapshot.mjs .close-output
      - name: Atomically advance independent close-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/publish_close.py
          python scripts/close_batch.py verify --score-date "${{ needs.prepare.outputs.score_date }}"

  outcome:
    name: Confirm close publication or explicit safe skip
    needs: [check, prepare, score, publish]
    # 默认success()会跳过失败/跳过的依赖，最终门禁必须always执行。
    if: always() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[run-close]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Fail unless publication was confirmed or safely unnecessary
        env:
          CLOSE_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/close_batch.py outcome
