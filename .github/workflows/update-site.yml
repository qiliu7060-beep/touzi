name: Source regression checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-site.yml'
      - 'touzi/plans.py'
      - 'touzi/report.py'
      - 'touzi/screener.py'
      - 'touzi/live_model.py'
      - 'touzi/market_calendar.py'
      - 'touzi/financial_coverage.py'
      - 'touzi/data/**'
      - 'touzi/signals/quality.py'
      - 'config/settings.toml'
      - 'config/trading-calendar.json'
      - 'scripts/run_all.py'
      - 'scripts/publish_site.py'
      - 'scripts/webui.py'
      - 'scripts/pick-financial.mjs'
      - 'tests/test_pick_financial.py'
      - 'scripts/publish_eligibility.py'
      - 'tests/test_publish_eligibility.py'
      - 'scripts/static/app.js'
      - 'scripts/live-scoring.mts'
      - 'scripts/live-model-validation.mts'
      - 'scripts/sync_live_runtime.py'
      - 'scripts/sync_browser_tests.py'
      - 'scripts/check-browser-release.mjs'
      - 'scripts/check_close_snapshot.mjs'
      - 'scripts/close-score-validation.mts'
      - 'scripts/close-browser.mjs'
      - 'scripts/close_batch.py'
      - 'scripts/publish_close.py'
      - 'touzi/close_snapshot.py'
      - 'tests/test_close*.py'
      - 'scripts/market-calendar.mjs'
      - 'scripts/financial-coverage.mjs'
      - 'tests/browser/**'
      - 'tests/test_market_calendar*'
      - 'scripts/static/test_dom.cjs'
      - 'tests/test_buy_decision.py'
      - 'tests/test_sell_snapshot.py'
      - 'tests/test_sell_decision.js'
      - 'tests/test_plan_rule_display.py'
      - 'tests/test_score_quote_freshness.py'
      - 'tests/test_valuation_thresholds.py'
      - 'tests/test_live_model.py'
      - 'tests/test_live_scoring.mjs'
      - 'tests/check_live_model.mjs'
      - 'tests/test_live_model_gate.py'
      - 'tests/test_financial*.py'
      - 'tests/test_financial_coverage.mjs'
      - 'tests/financial_fixtures.py'
permissions:
  contents: read

concurrency:
  group: github-pages
  # 如果数据源偶发卡住，下一轮采用更新的数据，不让旧任务排队堆积。
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Set up Node for cross-language scoring checks
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore market-data cache
        uses: actions/cache/restore@v4
        with:
          path: data_cache
          key: touzi-data-v1-${{ github.run_id }}
          restore-keys: |
            touzi-data-v1-

      - name: Check weekly macro reuse
        run: python tests/test_weekly_macro.py

      - name: Check holding sell decisions
        run: |
          python tests/test_buy_decision.py
          python tests/test_sell_snapshot.py
          python tests/test_plan_rule_display.py
          python tests/test_pick_financial.py
          python -m unittest tests.test_close_snapshot tests.test_close_batch
          python tests/test_score_quote_freshness.py
          python tests/test_valuation_thresholds.py
          python tests/test_live_model.py
          python tests/test_live_model_gate.py
          python -m unittest discover -s tests -p 'test_financial*.py'
          node tests/test_sell_decision.js

      - name: Check browser actions, financial search and market-calendar boundaries
        env:
          PYTHONUTF8: "1"
        run: |
          python tests/test_market_calendar.py
          python tests/test_publish_eligibility.py
          node scripts/check-browser-release.mjs

