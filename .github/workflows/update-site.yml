name: Update and deploy investment site

on:
  workflow_dispatch:
  schedule:
    # A 股交易日上午：北京时间 09:25、09:55、10:25、10:55、11:25。
    - cron: "25,55 1,2 * * 1-5"
    - cron: "25 3 * * 1-5"
    # A 股交易日下午：北京时间 13:00、13:30、14:00、14:30、15:00。
    - cron: "0,30 5,6 * * 1-5"
    - cron: "0 7 * * 1-5"
    # 收盘后补算：北京时间 15:20；晚间最终更新：北京时间 18:30。
    - cron: "20 7 * * 1-5"
    - cron: "30 10 * * 1-5"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-site.yml"
      - "requirements.txt"
      - "config/**"
      - "scripts/**"
      - "touzi/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # 如果数据源偶发卡住，下一轮采用更新的数据，不让旧任务排队堆积。
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Restore market-data cache
        uses: actions/cache/restore@v4
        with:
          path: data_cache
          key: touzi-data-v1-${{ github.run_id }}
          restore-keys: |
            touzi-data-v1-

      - name: Recalculate data and build site
        env:
          PYTHONUTF8: "1"
          TOUZI_PROXY: ""
        run: python scripts/publish_site.py --limit 300 --skip-backtest

      - name: Save final market-data cache
        if: github.event_name != 'schedule' || github.event.schedule == '30 10 * * 1-5'
        uses: actions/cache/save@v4
        with:
          path: data_cache
          key: touzi-data-v1-${{ github.run_id }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
