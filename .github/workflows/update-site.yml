name: Update and deploy investment site

on:
  workflow_dispatch:
  schedule:
    # 北京时间工作日 17:23，收盘后重新选股、重算个股评分。
    # 宏观评分由 --weekly-macro 按北京时间自然周复用。
    - cron: "23 9 * * 1-5"
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # 如果数据源偶发卡住，下一轮采用更新的数据，不让旧任务排队堆积。
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Restore market-data cache
        uses: actions/cache/restore@v4
        with:
          path: data_cache
          key: touzi-data-v1-${{ github.run_id }}
          restore-keys: |
            touzi-data-v1-

      - name: Check weekly macro reuse
        run: python tests/test_weekly_macro.py

      - name: Recalculate data and build site
        env:
          PYTHONUTF8: "1"
          TOUZI_PROXY: ""
        run: python scripts/publish_site.py --limit 300 --skip-backtest --weekly-macro

      - name: Save final market-data cache
        uses: actions/cache/save@v4
        with:
          path: data_cache
          key: touzi-data-v1-${{ github.run_id }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

