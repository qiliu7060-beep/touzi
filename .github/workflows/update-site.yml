name: Update and deploy investment site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-site.yml'
      - 'touzi/plans.py'
      - 'touzi/report.py'
      - 'touzi/screener.py'
      - 'touzi/live_model.py'
      - 'touzi/data/**'
      - 'touzi/signals/quality.py'
      - 'config/settings.toml'
      - 'scripts/run_all.py'
      - 'scripts/publish_site.py'
      - 'scripts/static/app.js'
      - 'scripts/live-scoring.mts'
      - 'scripts/live-model-validation.mts'
      - 'scripts/sync_live_runtime.py'
      - 'tests/test_buy_decision.py'
      - 'tests/test_sell_snapshot.py'
      - 'tests/test_sell_decision.js'
      - 'tests/test_plan_rule_display.py'
      - 'tests/test_score_quote_freshness.py'
      - 'tests/test_valuation_thresholds.py'
      - 'tests/test_live_model.py'
      - 'tests/test_live_scoring.mjs'
      - 'tests/check_live_model.mjs'
      - 'tests/test_live_model_gate.py'
      - 'tests/test_financial*.py'
      - 'tests/financial_fixtures.py'
  schedule:
    # 北京时间工作日 09:45、17:23 重算；18:23 复核一次收盘数据。
    # 定时任务可能延迟，发布前必须核验行情源的真实交易时间与覆盖率。
    # 宏观按正常缓存 TTL 更新，不强制整周冻结。
    - cron: "45 1 * * 1-5"
    - cron: "23 9 * * 1-5"
    - cron: "23 10 * * 1-5"
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # 如果数据源偶发卡住，下一轮采用更新的数据，不让旧任务排队堆积。
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Set up Node for cross-language scoring checks
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore market-data cache
        uses: actions/cache/restore@v4
        with:
          path: data_cache
          key: touzi-data-v1-${{ github.run_id }}
          restore-keys: |
            touzi-data-v1-

      - name: Check weekly macro reuse
        run: python tests/test_weekly_macro.py

      - name: Check holding sell decisions
        run: |
          python tests/test_buy_decision.py
          python tests/test_sell_snapshot.py
          python tests/test_plan_rule_display.py
          python tests/test_score_quote_freshness.py
          python tests/test_valuation_thresholds.py
          python tests/test_live_model.py
          python tests/test_live_model_gate.py
          python -m unittest discover -s tests -p 'test_financial*.py'
          node tests/test_sell_decision.js

      - name: Recalculate data and build site
        env:
          PYTHONUTF8: "1"
          TOUZI_PROXY: ""
        run: |
          extra=()
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            case "${{ github.event.schedule }}" in
              "23 9 * * 1-5"|"23 10 * * 1-5") extra=(--min-quote-time "15:00") ;;
              *) extra=(--min-quote-time "09:30") ;;
            esac
          fi
          python scripts/publish_site.py --limit 300 --skip-backtest "${extra[@]}"

      - name: Validate published model with the Worker schema
        run: node tests/check_live_model.mjs dist/live-model.json

      - name: Save final market-data cache
        uses: actions/cache/save@v4
        with:
          path: data_cache
          key: touzi-data-v1-${{ github.run_id }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
