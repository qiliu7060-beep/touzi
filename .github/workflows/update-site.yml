name: Update and deploy investment site

on:
  workflow_dispatch:
  schedule:
    # 工作日北京时间 18:30（UTC 10:30），在 A 股收盘后重算。
    - cron: "30 10 * * 1-5"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-site.yml"
      - "requirements.txt"
      - "config/**"
      - "scripts/**"
      - "touzi/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Restore market-data cache
        uses: actions/cache@v4
        with:
          path: data_cache
          key: touzi-data-v1-${{ github.run_id }}
          restore-keys: |
            touzi-data-v1-

      - name: Recalculate data and build site
        env:
          PYTHONUTF8: "1"
          TOUZI_PROXY: ""
        run: python scripts/publish_site.py --limit 300 --skip-backtest

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
