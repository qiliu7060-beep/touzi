name: Read-only close quote preflight
on:
  workflow_dispatch:
    inputs:
      score_date:
        description: '目标交易日 YYYY-MM-DD；空值检查最近已完成交易日'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-preflight.yml'
      - 'scripts/close_batch.py'
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate target-date quotes without scoring or publishing
        env:
          SCORE_DATE: ${{ inputs.score_date }}
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
          TOUZI_PROXY: ''
        run: python scripts/close_batch.py preflight --score-date "$SCORE_DATE"
